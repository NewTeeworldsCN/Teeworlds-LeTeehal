name: Build

on:
  push:
  pull_request:

jobs:
  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libpng-dev zlib1g-dev libicu-dev python3
      - name: Configure
        run: cmake -S . -B build
      - name: Build Leteehal-Server
        run: cmake --build build --target Leteehal-Server -j$(nproc)
